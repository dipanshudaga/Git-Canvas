<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Canvas: top bar + popup options</title>
<style>
  :root { --bg:#f6f6f3; --ink:#16161d; --muted:#667085; --line:#e6e7eb; --accent:#4262ff; --ok:#1a7f37; --bad:#cf222e; --warn:#b45309;
          --shadow:0 1px 2px rgba(20,20,40,.08), 0 6px 20px rgba(20,20,40,.12); --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace }
  * { box-sizing:border-box }
  body { margin:0; background:#ececea; color:var(--ink); font:15px/1.45 var(--font); padding:28px 28px 60px }
  h1 { font-size:22px; margin:0 0 4px } .sub { color:var(--muted); margin:0 0 28px }
  .opt { margin-bottom:44px } .opt h2 { font-size:18px; margin:0 0 2px } .opt p { margin:0 0 12px; color:var(--muted); max-width:820px }
  .pair { display:flex; gap:20px; flex-wrap:wrap }
  .cap { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#888; margin:0 0 6px }

  /* ---- sample canvas (fake board) ---- */
  .frame { position:relative; width:700px; height:440px; border-radius:14px; overflow:hidden; background:var(--bg); box-shadow:0 0 0 1px #d8d8d4; display:flex }
  .main { position:relative; flex:1; min-width:0; background-image:radial-gradient(rgba(30,30,60,.2) 1.2px, transparent 1.5px); background-size:26px 26px; transition:all .2s }
  .hd,.cd { position:absolute; width:190px; border-radius:11px; font-size:13px }
  .hd { height:60px; padding:9px 12px; color:#fff; font-weight:800; font-size:16px } .hd small { display:block; font-weight:700; font-size:11.5px; opacity:.9; margin-top:4px }
  .cd { height:70px; padding:9px 12px; border:2px solid; background:#fff; font-weight:650 } .cd i { display:block; font:700 11px var(--mono); font-style:normal; margin-bottom:3px }
  .a { left:34px; --c:#16a34a } .b { left:262px; --c:#4262ff } .c { left:490px; --c:#ec4899 }
  .hd { background:var(--c) } .cd { border-color:var(--c); box-shadow:0 0 0 100px color-mix(in srgb, var(--c) 12%, transparent) inset } .cd i { color:var(--c) }

  /* ---- shared pieces ---- */
  .bar,.pp,.fl { background:#fff; border-radius:12px; box-shadow:var(--shadow) }
  button { font:inherit; color:inherit; border:0; background:transparent; cursor:pointer }
  .btn { padding:6px 10px; border-radius:8px; font-weight:600; font-size:14px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px } .btn:hover,.btn.on { background:#f0f1f4 }
  .btn.pri { background:var(--accent); color:#fff } .btn.pri:hover { background:#3350e0 }
  .ib { width:34px; height:34px; border-radius:9px; display:inline-grid; place-items:center; font-size:16px; position:relative } .ib:hover,.ib.on { background:#f0f1f4 }
  .bdg { background:var(--accent); color:#fff; border-radius:9px; font-size:11px; font-weight:700; padding:0 6px; line-height:16px }
  .ib .bdg { position:absolute; top:1px; right:0; font-size:10px; padding:0 5px; line-height:15px }
  .chip { background:#f1f2f5; border-radius:9px; padding:6px 10px; font-weight:650; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap } .chip:hover,.chip.on { background:#e7e9ee }
  .div { width:1px; height:20px; background:var(--line); margin:0 3px; flex:none }
  .logo { font-weight:800; padding:0 8px 0 6px; white-space:nowrap }

  /* popover base */
  .pp { position:absolute; z-index:9; padding:12px; width:310px; display:none; font-size:14px } .pp.open { display:block }
  .pp.caret::before { content:""; position:absolute; top:-6px; left:var(--cx,40px); width:12px; height:12px; background:#fff; transform:rotate(45deg); border-radius:2px; box-shadow:-2px -2px 3px rgba(20,20,40,.05) }
  .pp.up.caret::before { top:auto; bottom:-6px; box-shadow:2px 2px 3px rgba(20,20,40,.05) }
  .pp h4 { margin:0 0 8px; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:#98a2b3; font-weight:800 }
  .in { display:flex; gap:6px } .in input { flex:1; min-width:0; border:0; box-shadow:0 0 0 1.5px var(--line) inset; border-radius:9px; padding:8px 10px; font:inherit; outline:none } .in input:focus { box-shadow:0 0 0 2px var(--accent) inset }
  .li { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px; font-weight:600; cursor:pointer } .li:hover { background:#f3f4f7 } .li i { margin-left:auto; font-style:normal; font-size:11px; font-weight:700; color:#667085; background:#f1f2f5; border-radius:8px; padding:0 7px }
  .fr { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 } .fr > span { font-weight:600 } .fr small { display:block; font-weight:400; color:var(--muted); font-size:12.5px }
  .seg { display:inline-flex; background:#f1f2f5; border-radius:9px; padding:2px } .seg b { font-weight:650; font-size:13px; padding:4px 9px; border-radius:7px; color:#475467; cursor:pointer } .seg b.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.18) }
  .sw { width:36px; height:21px; border-radius:11px; background:#d0d5dd; position:relative; flex:none } .sw::after { content:""; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3) } .sw.on { background:var(--accent) } .sw.on::after { left:17px }
  .hot { padding:8px 10px; border-radius:9px; box-shadow:0 0 0 1px var(--line) inset; margin-bottom:6px } .hot.on { background:#fef3c7; box-shadow:0 0 0 2px #f59e0b inset } .hot code { font:600 13px var(--mono) } .hot div { margin-top:5px; display:flex; gap:4px; flex-wrap:wrap }
  .pl { font-size:12px; font-weight:700; border-radius:10px; padding:0 8px; line-height:19px } .pl.x { background:#e0e7ff; color:#4262ff } .pl.y { background:#fce7f3; color:#ec4899 }
  .note { color:var(--muted); font-size:13px; margin:8px 0 0 }

  /* ===== V1 slim bar + anchored dropdowns ===== */
  .v1 .bar { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px; padding:4px 6px }
  /* ===== V2 command bar ===== */
  .v2 .bar { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:5px 6px 5px 12px; width:560px }
  .v2 .find { flex:1; min-width:0; white-space:nowrap; overflow:hidden; display:flex; align-items:center; gap:8px; background:#f1f2f5; border-radius:9px; padding:7px 10px; color:var(--muted); font-weight:500; cursor:text } .v2 .find b { color:var(--ink); flex:none } .v2 .find span { overflow:hidden; text-overflow:ellipsis } .v2 .find kbd { margin-left:auto; font:600 11px var(--font); background:#fff; border-radius:5px; padding:1px 6px; box-shadow:0 0 0 1px var(--line) }
  /* ===== V3 docked panel ===== */
  .frame.v3 .main { overflow:hidden } .frame.v3 .dock { position:relative; z-index:20; box-shadow:-6px 0 16px rgba(20,20,40,.06); width:0; background:#fff; border-left:1px solid var(--line); overflow:hidden; transition:width .2s; flex:none } .frame.v3.open .dock { width:290px }
  .v3 .dock .in2 { width:290px; padding:12px 14px } .v3 .tabs { display:flex; gap:2px; background:#f1f2f5; border-radius:10px; padding:3px; margin-bottom:12px } .v3 .tabs b { flex:1; text-align:center; padding:5px 0; border-radius:8px; font-size:13px; font-weight:650; color:#475467; cursor:pointer } .v3 .tabs b.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.18) }
  .v3 .tl { position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:4px; padding:4px 6px } .v3 .tr { position:absolute; top:10px; right:10px; display:flex; gap:2px; padding:4px }
  /* ===== V4 icon rail ===== */
  .v4 .bar { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px; padding:4px 5px; border-radius:22px }
  .v4 .pp { width:280px }
  .tip { position:absolute; top:52px; background:#16161d; color:#fff; font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; transform:translateX(-50%); white-space:nowrap }
  /* ===== V5 bottom dock ===== */
  .v5 .tl { position:absolute; top:10px; left:10px; padding:4px 6px; display:flex; align-items:center; gap:4px }
  .v5 .bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px; padding:5px 6px; border-radius:14px }
</style>
</head>
<body>
<h1>Top bar + popup options</h1>
<p class="sub">Five directions. Each row shows the same sample board twice: once with <b>Add repo</b> open and once with <b>Filters / Hot files</b> open, so you can compare how much each one covers. Everything is clickable.</p>
<div id="root"></div>

<script>
const addRepo = () => `<div class="in"><input placeholder="owner/repo, URL or folder" value=""><button class="btn pri">Add</button></div><h4 style="margin:12px 0 4px">Recent</h4>
  <div class="li">⌁ tauri-apps/tauri <i>GitHub</i></div><div class="li">⌁ vercel/next.js <i>GitHub</i></div><div class="li">📁 Git-Canvas <i>local</i></div>`;
const filters = () => `<div class="fr"><span>Load up to</span><div class="seg"><b>10</b><b class="on">25</b><b>50</b><b>100</b></div></div>
  <div class="fr"><span>Hide stale</span><div class="seg"><b class="on">Off</b><b>30d</b><b>90d</b><b>1y</b></div></div>
  <div class="fr"><span>Hide fully merged</span><div class="sw"></div></div><div class="fr"><span>Only with conflicts</span><div class="sw on"></div></div>
  <p class="note">Showing 4 of 5 loaded branches</p>`;
const hot = () => `<div class="hot on"><code>config.py</code><div><span class="pl x">⑂ hotfix/x</span><span class="pl y">⑂ feature/login</span></div></div><div class="hot"><code>src/app.py</code><div><span class="pl x">⑂ hotfix/x</span><span class="pl y">⑂ feature/login</span></div></div><p class="note">Click a file to highlight its branches.</p>`;
const board = () => `<div class="hd a" style="top:110px">⑂ main<small>main line</small></div><div class="cd a" style="top:184px"><i>9dbe6da</i>Update README</div><div class="cd a" style="top:270px"><i>35e176e</i>Merge feature/…</div><div class="cd a" style="top:356px"><i>0da66eb</i>Add config</div>
  <div class="hd b" style="top:170px">⑂ hotfix/x<small>↑2 ↓4 ⚠ conflicts</small></div><div class="cd b" style="top:244px"><i>7af4f4d</i>Hotfix config</div><div class="cd b" style="top:330px"><i>bd2aa2c</i>Hotfix crash</div>
  <div class="hd c" style="top:140px">⑂ feature/login<small>↑2 ↓5 ⚠ conflicts</small></div><div class="cd c" style="top:214px"><i>f4293b7</i>Login config</div><div class="cd c" style="top:300px"><i>0408d3e</i>Add login to app</div>`;

const V = [
 { t:'1 · Slim bar, dropdowns that hang off their button',
   d:'One slim row. Each button opens a small (310px) dropdown directly under it with a little pointer, so it covers only what is below that button. Click outside to close.',
   cls:'v1',
   bar:`<div class="bar"><span class="logo">◈ Git Canvas</span><span class="chip" data-t="repos">Git-Canvas ▾</span><span class="div"></span><button class="btn" data-t="add">+ Add repo</button><button class="btn" data-t="filters">⚙ Filters</button><button class="btn" data-t="hot">🔥 Hot <span class="bdg">1</span></button><button class="btn">Expand all</button><button class="btn pri">⟳ Reload</button></div>`,
   pops:{ add:addRepo(), filters:filters(), hot:hot() }, A:'add', B:'filters', place:'under' },
 { t:'2 · Command bar (one box for repos)',
   d:'The repo switcher and "Add repo" become one search box. Typing owner/repo, a URL or a folder shows matches right underneath, so there is no separate Add dialog. Filters and Hot files are small icon dropdowns on the right.',
   cls:'v2',
   bar:`<div class="bar"><b>◈</b><div class="find" data-t="add">⌁ <b>tauri-apps/tauri</b> <span>· switch or add a repo…</span><kbd>⌘K</kbd></div><button class="ib" data-t="filters" title="Filters">⚙</button><button class="ib" data-t="hot" title="Hot files">🔥<span class="bdg">1</span></button><button class="ib" title="Expand all">⇳</button><button class="btn pri">⟳</button></div>`,
   pops:{ add:addRepo(), filters:filters(), hot:hot() }, A:'add', B:'filters', place:'under', wide:'add' },
 { t:'3 · Docked side panel (canvas makes room)',
   d:'Nothing floats over the board. Repo switcher top-left, actions top-right. Clicking one slides a 290px panel in from the right with tabs (Repos, Filters, Hot files) and the canvas narrows to fit, so nothing is ever covered.',
   cls:'v3', dock:true,
   bar:`<div class="fl tl"><span class="logo">◈ Git Canvas</span><span class="chip">Git-Canvas ▾</span></div><div class="fl tr"><button class="ib" data-t="add" title="Repos">＋</button><button class="ib" data-t="filters" title="Filters">⚙</button><button class="ib" data-t="hot" title="Hot files">🔥<span class="bdg">1</span></button><button class="ib" title="Reload">⟳</button></div>`,
   pops:{ add:addRepo(), filters:filters(), hot:hot() }, A:'add', B:'filters' },
 { t:'4 · Icon-only pill with tooltips',
   d:'The smallest footprint: a rounded pill with icons only (labels show on hover). Dropdowns are narrow (280px) and hang under their icon. Best when you want maximum canvas; costs a little discoverability.',
   cls:'v4',
   bar:`<div class="bar"><span class="chip" data-t="repos" style="margin-right:2px">◈ Git-Canvas ▾</span><button class="ib" data-t="add">＋</button><button class="ib" data-t="filters">⚙</button><button class="ib" data-t="hot">🔥<span class="bdg">1</span></button><button class="ib">⇳</button><button class="ib" style="background:var(--accent);color:#fff;border-radius:50%">⟳</button></div>`,
   pops:{ add:addRepo(), filters:filters(), hot:hot() }, A:'add', B:'hot', place:'under', tip:true },
 { t:'5 · Bottom dock (like Figma/Miro), menus open upward',
   d:'Top of the screen stays almost empty: just the logo and repo switcher in the corner. Actions live in a dock at the bottom center and their menus open upward. The top, where you read branch titles, is left clear.',
   cls:'v5',
   bar:`<div class="fl tl"><span class="logo">◈ Git Canvas</span><span class="chip" data-t="add">Git-Canvas ▾</span></div><div class="bar"><button class="btn" data-t="filters">⚙ Filters</button><button class="btn" data-t="hot">🔥 Hot files <span class="bdg">1</span></button><button class="btn">Expand all</button><span class="div"></span><button class="btn pri">⟳ Reload</button></div>`,
   pops:{ add:addRepo(), filters:filters(), hot:hot() }, A:'add', B:'filters', place:'mixed' },
];

const root = document.getElementById('root');
V.forEach(v => {
  const sec = document.createElement('section'); sec.className = 'opt';
  sec.innerHTML = `<h2>${v.t}</h2><p>${v.d}</p><div class="pair"></div>`; root.appendChild(sec);
  [['A', v.A, 'Add repo open'], ['B', v.B, v.B === 'hot' ? 'Hot files open' : 'Filters open']].forEach(([k, start, label]) => {
    const w = document.createElement('div');
    w.innerHTML = `<div class="cap">${label}</div><div class="frame ${v.cls}"><div class="main">${board()}${v.dock ? '' : ''}${v.bar}</div>${v.dock ? '<div class="dock"><div class="in2"><div class="tabs"><b data-tab="add">Repos</b><b data-tab="filters">Filters</b><b data-tab="hot">Hot files</b></div><div class="body"></div></div></div>' : ''}</div>`;
    sec.querySelector('.pair').appendChild(w);
    const frame = w.querySelector('.frame'), main = w.querySelector('.main');
    const pops = {};
    if (!v.dock) for (const id in v.pops) {
      const p = document.createElement('div'); p.className = 'pp caret'; p.innerHTML = v.pops[id]; main.appendChild(p); pops[id] = p;
    }
    const open = id => {
      if (v.dock) {
        frame.classList.add('open'); frame.querySelectorAll('.tabs b').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
        frame.querySelector('.body').innerHTML = v.pops[id]; return;
      }
      Object.values(pops).forEach(p => p.classList.remove('open')); main.querySelectorAll('[data-t]').forEach(b => b.classList.remove('on'));
      const p = pops[id]; if (!p) return; p.classList.add('open');
      const btn = main.querySelector(`[data-t="${id}"]`); btn && btn.classList.add('on');
      const fr = main.getBoundingClientRect(), br = btn.getBoundingClientRect(), bc = br.left - fr.left + br.width / 2;
      let width = id === 'add' && v.wide ? 560 : 310; if (v.cls === 'v4') width = 280; p.style.width = width + 'px';
      let left = Math.min(Math.max(8, bc - 40), fr.width - width - 8); if (id === 'add' && v.wide) left = (fr.width - 560) / 2;
      p.style.left = left + 'px'; p.style.setProperty('--cx', Math.max(14, bc - left - 6) + 'px');
      const up = v.cls === 'v5' && id !== 'add';
      p.classList.toggle('up', up); p.style.top = up ? 'auto' : (br.bottom - fr.top + 10) + 'px'; p.style.bottom = up ? (fr.bottom - br.top + 10) + 'px' : 'auto';
    };
    main.addEventListener('click', e => { const t = e.target.closest('[data-t]'); if (t && t.dataset.t !== 'repos') open(t.dataset.t); else if (!e.target.closest('.pp')) { Object.values(pops).forEach(p => p.classList.remove('open')); main.querySelectorAll('[data-t]').forEach(b => b.classList.remove('on')); } });
    frame.querySelectorAll('.tabs b').forEach(b => b.onclick = () => open(b.dataset.tab));
    requestAnimationFrame(() => open(start));
    if (v.tip) { const t = main.querySelector(`[data-t="${start}"]`); }
  });
});
</script>
</body>
</html>
